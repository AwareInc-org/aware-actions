name: Shell Lint (reusable)

# Lints shell scripts: shellcheck, a macOS bash-3.2 compatibility syntax check,
# PSScriptAnalyzer for PowerShell, and an optional Windows batch-file check
# (set check_batch_files for repos that ship .bat/.cmd files). Callers own their
# own `on: push/pull_request: paths: [...]` trigger — see docs/design.md.

on:
  workflow_call:
    inputs:
      check_batch_files:
        description: 'Also run the Windows batch-file check job (cmd.exe syntax check)'
        required: false
        type: boolean
        default: false

jobs:
  shellcheck:
    name: Shell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          # Collect scripts by extension and extensionless files with shell shebangs.
          # shellcheck reads each file's shebang to select the right rules automatically.
          mapfile -t scripts < <(
            find . -not -path './.git/*' \
              \( -name '*.sh' -o -name '*.bash' -o -name '*.zsh' -o -name '*.ksh' \)
            find . -not -path './.git/*' -type f ! -name '*.*' \
              -exec grep -lE '^#!/(usr/bin/env )?(bash|sh|zsh|ksh|dash)' {} \; 2>/dev/null || true
          )
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No shell scripts found"
            exit 0
          fi
          shellcheck "${scripts[@]}"

  bash-compat:
    name: Syntax check (macOS bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify /bin/bash is 3.x
        run: /bin/bash --version | head -1

      - name: Syntax check bash scripts with macOS bash 3.2
        run: |
          # Only bash scripts are relevant for the macOS 3.2 compatibility check.
          find . -not -path './.git/*' \
            \( -name '*.sh' -o -name '*.bash' -o \( -type f ! -name '*.*' \) \) | \
            xargs grep -lE '^#!/(usr/bin/env )?bash' | \
            xargs -I{} /bin/bash -n {}

  powershell-check:
    name: PowerShell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Syntax check
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Include '*.ps1','*.psm1','*.psd1' |
            Where-Object { $_.FullName -notmatch '\.git' } |
            ForEach-Object {
              $parseErrors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$null, [ref]$parseErrors
              )
              foreach ($e in $parseErrors) {
                $errors += "$($_.Name):$($e.Extent.StartLineNumber): $($e.Message)"
              }
            }
          if ($errors) { $errors; exit 1 }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Get-ChildItem -Recurse -Include '*.ps1','*.psm1','*.psd1' |
            Where-Object { $_.FullName -notmatch '\.git' } |
            Invoke-ScriptAnalyzer -Settings PSGallery
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }

  batch-check:
    name: Batch file check
    if: inputs.check_batch_files
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax check batch files with cmd.exe
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set "exit_code=0"
          for /r . %%f in (*.bat *.cmd) do (
            if "%%f:\.git=%%"=="%%f" (
              echo Checking: %%~nf
              cmd /c "call "%%f" >nul 2>&1" && (
                echo   OK: %%~nf
              ) || (
                echo   ERROR in %%~nf
                set "exit_code=1"
              )
            )
          )
          exit /b !exit_code!
