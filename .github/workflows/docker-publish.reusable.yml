name: Docker Publish (reusable)

# Shared multi-arch build+push.
# Callers still own their own `on:` trigger — see docs/design.md.

on:
  workflow_call:
    inputs:
      image:
        description: 'DockerHub repo to publish to, e.g. examplehub/example-cli'
        required: true
        type: string
      dockerfile:
        description: 'Path to the Dockerfile, relative to the repo root'
        required: false
        type: string
        default: docker/Dockerfile
      context:
        description: 'Docker build context'
        required: false
        type: string
        default: .
      platforms:
        description: 'Comma-separated build platforms'
        required: false
        type: string
        default: linux/amd64,linux/arm64
      tag:
        description: 'Tag to push on a manual (workflow_dispatch) run; caller passes its own dispatch input through'
        required: false
        type: string
        default: test-build
      update_latest:
        description: 'Also tag :latest on a manual (workflow_dispatch) run. Leave off for scratch/test builds; turn on when manually publishing a real release.'
        required: false
        type: boolean
        default: false
      version_build_arg:
        description: 'Name of a build-arg to receive the resolved version/tag (e.g. VERSION, AWARE_VERSION). Leave empty to skip.'
        required: false
        type: string
        default: ''
      build_args:
        description: 'Additional newline-separated NAME=value build args for the Dockerfile, passed through as-is'
        required: false
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to DockerHub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        env:
          IMAGE: ${{ inputs.image }}
          DISPATCH_TAG: ${{ inputs.tag }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$UPDATE_LATEST" == "true" ]]; then
              echo "value=${IMAGE}:${DISPATCH_TAG},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            else
              echo "value=${IMAGE}:${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
            fi
            echo "resolved_version=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            # github.ref_name is unreliable for release events (can be empty:
            # https://github.com/actions/runner/issues/2788) — use the event
            # payload's tag_name instead.
            echo "value=${IMAGE}:${RELEASE_TAG},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "resolved_version=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${IMAGE}:${{ github.ref_name }},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "resolved_version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve build args
        id: build_args
        env:
          VERSION_ARG_NAME: ${{ inputs.version_build_arg }}
          RESOLVED_VERSION: ${{ steps.tags.outputs.resolved_version }}
          EXTRA_BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          {
            echo "value<<BUILD_ARGS_EOF"
            # bash -e is on by default for run: steps — a bare `[[ ]] && echo` whose
            # condition is false exits nonzero and would abort the step, so `|| true`.
            [[ -n "$VERSION_ARG_NAME" ]] && echo "${VERSION_ARG_NAME}=${RESOLVED_VERSION}" || true
            [[ -n "$EXTRA_BUILD_ARGS" ]] && printf '%s\n' "$EXTRA_BUILD_ARGS" || true
            echo "BUILD_ARGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Show disk usage before build
        run: |
          df -h /
          docker system df || true

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: ${{ steps.build_args.outputs.value }}
          # mode=min caches only the final image layers, not every intermediate
          # builder-stage layer for all platforms
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Show disk usage after build
        if: always()
        run: |
          df -h /
          docker system df || true
