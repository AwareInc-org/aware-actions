name: Python Test (reusable)

# Runs a repo's pytest suite in a fresh venv via `pip install -e .` + pytest.
# Optionally checks out and editable-installs a set of sibling repos first,
# for callers whose code imports another repo's source tree directly rather
# than a published package. This workflow has no built-in knowledge of any
# specific repo -- sibling_repos is supplied entirely by the caller.
# Callers own their own `on: push/pull_request` trigger.

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version to set up'
        required: false
        type: string
        default: '3.x'
      extras:
        description: 'Optional-dependencies extras to install from this repo''s own pyproject.toml, comma-separated (e.g. dev)'
        required: false
        type: string
        default: 'dev'
      test_path:
        description: 'Path(s) to pass to pytest'
        required: false
        type: string
        default: 'tests/'
      pytest_args:
        description: 'Additional arguments passed through to pytest'
        required: false
        type: string
        default: ''
      sibling_repos:
        description: >
          YAML list of other repos to checkout and `pip install -e` before
          installing/testing this repo. Each entry should have:
            repo: owner/repo@ref (required)
            path: relative path to checkout (required)
            env_var: optional env var name to export checkout path
            extras: optional comma-separated extras to install (e.g. aws,dev)
          Example:
            - repo: AwareInc-org/aware-common-lib@main
              path: aware-common-lib
              env_var: AWARE_COMMON_LIB_DIR
              extras: aws
        required: false
        type: string
        default: ''
      install_self:
        description: >
          Whether to `pip install -e` this repo's own checkout before testing.
          Set to false for callers whose repo root has a non-packaging setup.py
          (e.g. an operational CLI entrypoint) that breaks setuptools' editable
          build; such repos should also set `pythonpath` in their own
          pyproject.toml so their source is importable without an install.
        required: false
        type: boolean
        default: true
    secrets:
      SIBLING_REPO_TOKEN:
        description: 'Token with read access to the repos listed in sibling_repos, if private'
        required: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install pytest and pytest-cov
        run: pip install pytest pytest-cov

      - name: Checkout and install sibling repos
        if: inputs.sibling_repos != ''
        env:
          SIBLING_REPOS: ${{ inputs.sibling_repos }}
          TOKEN: ${{ secrets.SIBLING_REPO_TOKEN }}
        run: |
          echo "$SIBLING_REPOS" | yq -r '.[] | @json' | while read -r entry; do
            repo=$(echo "$entry" | jq -r '.repo')
            path=$(echo "$entry" | jq -r '.path')
            env_var=$(echo "$entry" | jq -r '.env_var // empty')
            extras=$(echo "$entry" | jq -r '.extras // empty')

            ref="${repo##*@}"
            repo_name="${repo%@*}"
            echo "Cloning ${repo_name}@${ref} to ${path}"
            git clone --branch "$ref" --depth 1 "https://x-access-token:${TOKEN}@github.com/${repo_name}.git" "$path"

            if [[ -n "$extras" ]]; then
              pip install -e "${path}[${extras}]"
            else
              pip install -e "$path"
            fi

            if [[ -n "$env_var" ]]; then
              echo "${env_var}=$(cd "$path" && pwd)" >> "$GITHUB_ENV"
            fi
          done

      - name: Install dependencies
        if: inputs.install_self
        working-directory: repo
        run: |
          if [[ -n "${{ inputs.extras }}" ]]; then
            pip install -e ".[${{ inputs.extras }}]"
          else
            pip install -e .
          fi

      - name: Run pytest
        working-directory: repo
        run: pytest ${{ inputs.test_path }} --cov --cov-report=term-missing ${{ inputs.pytest_args }}
