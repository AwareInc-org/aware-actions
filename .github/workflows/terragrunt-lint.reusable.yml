name: Terragrunt Lint (reusable)

# Checks Terragrunt HCL formatting (terragrunt hcl format --check). Pure syntax
# formatting only -- deliberately does NOT run `terragrunt hcl validate`, which
# was found to hang indefinitely against real live/ configs,
# apparently while resolving backend/provider state. Add validation only with
# a hard timeout and real cloud credentials wired in, if ever.

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Directory to check (checked recursively)'
        required: false
        type: string
        default: '.'
      terragrunt_version:
        description: 'Terragrunt version to install, e.g. v1.1.3, or "latest"'
        required: false
        type: string
        default: 'latest'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve terragrunt version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ inputs.terragrunt_version }}" == "latest" ]]; then
            tag=$(gh api repos/gruntwork-io/terragrunt/releases/latest --jq '.tag_name')
          else
            tag="${{ inputs.terragrunt_version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install terragrunt
        run: |
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/${{ steps.version.outputs.tag }}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Check HCL formatting
        run: terragrunt hcl format --check --working-dir "${{ inputs.working_directory }}"
