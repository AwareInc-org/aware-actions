name: Terragrunt Render (reusable)

# Confirms every Terragrunt unit (a terragrunt.hcl with a `terraform` block)
# under working_directory actually renders (`terragrunt render --all`),
# and flags `dependency` blocks with no `mock_outputs` -- the Terragrunt
# equivalent of a chart with no usable defaults, since a unit shaped that way
# can't be planned before its dependency has ever been applied, or in CI
# with no cloud credentials.
#
# Pass/fail is decided by scanning stderr for Terragrunt's "ERROR" log lines,
# not the process exit code: once a `dependency` block falls back to mock
# outputs (expected in CI, where there's no real state to read), Terragrunt
# exits 0 even when that fallback cascades into a genuine error elsewhere in
# the same unit.
#
# Unlike `terragrunt hcl validate` (deliberately avoided by
# terragrunt-lint.reusable.yml -- see that file's header), reading a
# dependency's outputs against an unreachable backend fails fast locally
# ("backend not initialized") rather than making a live network call.
# timeout_minutes still caps the step as a backstop.
#
# Needs outbound network access to fetch any unit whose `terraform.source` is
# a remote (git/registry) module, the same as any terraform init-adjacent
# command would.

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Directory to search recursively for Terragrunt units'
        required: false
        type: string
        default: '.'
      terragrunt_version:
        description: 'Terragrunt version to install, e.g. v1.1.3, or "latest"'
        required: false
        type: string
        default: 'latest'
      tf_binary:
        description: 'Binary for terragrunt to drive: "tofu" or "terraform"'
        required: false
        type: string
        default: 'tofu'
      tf_version:
        description: 'Version of tf_binary to install'
        required: false
        type: string
        default: 'latest'
      require_mock_outputs:
        description: 'Fail (instead of warn) when a dependency block has no mock_outputs'
        required: false
        type: boolean
        default: false
      timeout_minutes:
        description: 'Hard cap on the render step, as a backstop against an unexpected hang'
        required: false
        type: number
        default: 10

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve terragrunt version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ inputs.terragrunt_version }}" == "latest" ]]; then
            tag=$(gh api repos/gruntwork-io/terragrunt/releases/latest --jq '.tag_name')
          else
            tag="${{ inputs.terragrunt_version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install terragrunt
        run: |
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/${{ steps.version.outputs.tag }}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Set up OpenTofu
        if: inputs.tf_binary == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tf_version }}

      - name: Set up Terraform
        if: inputs.tf_binary == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.tf_version }}
          terraform_wrapper: false

      - name: Render all units
        id: render
        timeout-minutes: ${{ inputs.timeout_minutes }}
        run: |
          terragrunt render --all --format json --write --non-interactive \
            --working-dir "${{ inputs.working_directory }}" \
            > /tmp/render.stdout.log 2> /tmp/render.stderr.log || true

          cat /tmp/render.stderr.log

          if grep -q "ERROR" /tmp/render.stderr.log; then
            echo "::error::One or more Terragrunt units failed to render -- see the ERROR lines above. This usually means a real HCL bug, a variable with no default, or a dependency with no mock_outputs (checked next)."
            exit 1
          fi

          echo "All units rendered without errors."

      - name: Check dependency blocks define mock_outputs
        run: |
          mapfile -d '' -t rendered < <(find "${{ inputs.working_directory }}" -name 'terragrunt.rendered.json' -print0)
          if [[ ${#rendered[@]} -eq 0 ]]; then
            echo "::error::No Terragrunt units found under ${{ inputs.working_directory }} (no terragrunt.hcl with a terraform block)"
            exit 1
          fi

          status=0
          for f in "${rendered[@]}"; do
            dir=$(dirname "$f")
            mapfile -t missing < <(jq -r '.dependency // {} | to_entries[] | select(.value.mock_outputs == null and .value.skip != true) | .key' "$f")
            for dep in "${missing[@]}"; do
              message="dependency \"$dep\" has no mock_outputs -- this unit can't render safely without $dep's real state (e.g. before it's ever been applied, or in CI with no cloud credentials)"
              if [[ "${{ inputs.require_mock_outputs }}" == "true" ]]; then
                echo "::error file=$dir/terragrunt.hcl::$message"
                status=1
              else
                echo "::warning file=$dir/terragrunt.hcl::$message"
              fi
            done
          done
          exit $status
